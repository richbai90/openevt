[workspace]
members = [
    ".",
    "crates/openevt-core",
    "crates/openevt-devices",
    "crates/openevt-abi",
    "crates/openevt-py",
    "openevt-plugins",
    "openevt-plugin-lucid-evs",
]
resolver = "3"

[package]
name = "openevt"
version = "1.0.5"
edition = "2024"
authors = ["Rich Baird <rich@rbaird.me>"]
description = "An independently maintained Rust implementation inspired by Prophesee's OpenEB event-camera abstractions"
license = "MIT"
repository = "https://github.com/richbai90/openevt"
documentation = "https://docs.rs/openevt"
exclude = [".ccls-cache", "openevt-plugins/tools/**"]

[features]
default = ["all"]
all = ["devices", "framegen", "plugins"]
# Alias kept for agents.md verification commands (`--features python,full`).
full = ["all"]
devices = ["dep:openevt-devices", "openevt-core/full"]
python = ["devices", "plugins", "dep:openevt-py", "openevt-py/python"]
framegen = ["dep:openevt-abi", "openevt-abi/framegen"]
plugins = ["dep:openevt-abi"]

[dependencies]
openevt-core = { path = "crates/openevt-core" }
openevt-devices = { path = "crates/openevt-devices", optional = true }
openevt-abi = { path = "crates/openevt-abi", optional = true }
openevt-py = { path = "crates/openevt-py", optional = true }
derive-new = "0.7.0"
paste = "1.0.15"

[lib]
name = "openevt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
