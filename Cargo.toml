[workspace]
members = [".", "openevt-plugins", "openevt-plugin-lucid-evs"]
resolver = "3"

[package]
name = "openevt"
version = "1.0.5"
edition = "2024"
authors = ["Rich Baird <rich@rbaird.me>"]
description = "An independently maintained Rust implementation inspired by Prophesee's OpenEB event-camera abstractions"
license = "MIT"
repository = "https://github.com/richbai90/openevt"
documentation = "https://docs.rs/openevt"
exclude = [".ccls-cache", "openevt-plugins/tools/**"]

[features]
default = ["all"]
all = ["devices", "framegen", "plugins"]
devices = ["dep:num-traits", "dep:regex"]
python = ["devices", "plugins", "dep:pyo3", "dep:numpy"]
framegen = ["dep:abi_stable"]
plugins = ["dep:abi_stable"]

[dependencies]
anyhow = "1.0.100"
abi_stable = { version = "0.11.3", optional = true }
thiserror = "2.0.18"
log = "0.4.29"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
derive-new = "0.7.0"
paste = "1.0.15"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["serde"] }
num-traits = { version = "0.2.19", optional = true }
regex = { version = "1.12.3", optional = true }
pyo3 = {
    version = "0.29.0",
    optional = true,
    features = ["experimental-async", "extension-module", "abi3-py39"],
}
numpy = { version = "0.29.0", optional = true }
serde_json = "1.0.151"
slotmap = "1.1.1"

[lib]
name = "openevt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
