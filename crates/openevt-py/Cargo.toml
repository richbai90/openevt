[package]
name = "openevt-py"
version = "1.0.5"
edition = "2024"
authors = ["Rich Baird <rich@rbaird.me>"]
description = "PyO3 Python bindings for the openevt event-camera stack"
license = "MIT"
repository = "https://github.com/richbai90/openevt"

[features]
default = []
# PyO3 bindings. Domain logic stays PyO3-agnostic behind this single flag.
python = ["dep:pyo3", "dep:numpy", "dep:abi_stable", "dep:crossbeam"]
evt3 = ["openevt-core/evt3"]
decoder = ["openevt-core/decoder"]
full = ["openevt-core/full", "evt3", "decoder"]

[dependencies]
abi_stable = { version = "0.11.3", optional = true }
crossbeam = { version = "0.8.4", optional = true, features = ["crossbeam-channel"] }
numpy = { version = "0.29.0", optional = true }
openevt-abi = { path = "../openevt-abi" }
openevt-core = { path = "../openevt-core" }
openevt-devices = { path = "../openevt-devices" }
pyo3 = { version = "0.29.0", optional = true, features = [
    "experimental-async",
    "extension-module",
    "abi3-py39",
] }

[lib]
name = "openevt_py"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
