[package]
name = "openevt-abi"
version = "1.0.5"
edition = "2024"
authors = ["Rich Baird <rich@rbaird.me>"]
description = "Stable ABI plugin bridge for openevt device plugins"
license = "MIT"
repository = "https://github.com/richbai90/openevt"

[features]
default = []
# Event-to-frame generation interfaces for frame-generator plugins.
framegen = ["openevt-core/framegen"]

[dependencies]
abi_stable = "0.11.3"
openevt-core = { path = "../openevt-core", features = ["plugins"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
slotmap = "1.1.1"
thiserror = "2.0.18"
toml = { version = "1.1.4", features = ["serde"] }

[lib]
name = "openevt_abi"
path = "src/lib.rs"
crate-type = ["rlib"]
