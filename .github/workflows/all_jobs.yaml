name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian LTS (bookworm)
            runner: ubuntu-latest
            container: rust:1-bookworm
          - name: Debian latest (trixie)
            runner: ubuntu-latest
            container: rust:1-trixie
          - name: Windows
            runner: windows-latest
            container: null
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    with:
      persist-credentials: false
