[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "openevt"
version = "1.0.5"
description = "Independent OpenEB-inspired event camera abstractions and Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Rich Baird", email = "rich@rbaird.me" },
]
dependencies = [
    "numpy>=1.21",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
bindings = "pyo3"
# PyO3 bindings live in the openevt-py workspace member; the module keeps the
# `openevt` import name so existing Python users are unaffected.
module-name = "openevt"
manifest-dir = "crates/openevt-py"
# Mixed layout so the type stubs (.pyi) and py.typed marker ship in the wheel.
python-source = "python"
features = ["python", "full"]
strip = true
exclude = [
    "openevt-plugins/tools/**",
]
